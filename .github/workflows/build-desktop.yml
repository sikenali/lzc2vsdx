name: Build desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Bundle backend (PyInstaller onefile)
        run: python scripts/build_backend.py

      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci

      - name: Build Windows portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd electron
          npx electron-builder --win portable --x64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: electron/release/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Bundle backend (PyInstaller onefile)
        run: python scripts/build_backend.py

      - name: Install Graphviz for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          bash scripts/bundle_graphviz_linux.sh

      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci

      - name: Build AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd electron
          npx electron-builder --linux AppImage --x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: electron/release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
